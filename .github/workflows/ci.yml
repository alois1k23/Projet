name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

defaults:
  run:
    working-directory: clair

jobs:
  qualite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clair
          POSTGRES_PASSWORD: clair_dev
          POSTGRES_DB: clair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clair" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clair:clair_dev@localhost:5432/clair_test
      TEST_DATABASE_URL: postgresql://clair:clair_dev@localhost:5432/clair_test
      E2E_DATABASE_URL: postgresql://clair:clair_dev@localhost:5432/clair_e2e
      CLAIR_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clair/package-lock.json
      - run: npm ci
      - name: Base de données des tests de bout en bout
        run: PGPASSWORD=clair_dev psql -h localhost -U clair -d clair_test -c "CREATE DATABASE clair_e2e"
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: clair/test-results
